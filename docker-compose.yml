# Production-like stack:  make up   (vitalsctl gen-secrets + docker compose up --build)
# With central logging:   docker compose --profile observability up --build
name: vitals-monitor

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vitals
      POSTGRES_DB: vitals
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitals -d vitals"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    image: vitals-monitor-backend:latest
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      APP_ENVIRONMENT: prod
      APP_DATABASE__USERNAME: vitals
      APP_DATABASE__PASSWORD_FILE: /run/secrets/db_password
      APP_SECURITY__JWT_SECRETS_FILE: /run/secrets/jwt_secrets
      APP_SECURITY__ENCRYPTION_KEYS_FILE: /run/secrets/encryption_keys
      APP_SECURITY__USERS_JSON_FILE: /run/secrets/users_json
      RUST_LOG: info
    secrets: [db_password, jwt_secrets, encryption_keys, users_json]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped            # self-healing: crashed container is restarted
    deploy:
      resources: { limits: { cpus: "1.0", memory: 256M } }
    labels: { logging: "vitals" }
    networks: [internal]

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      backend: { condition: service_healthy }
    ports: ["443:443", "80:80"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped
    labels: { logging: "vitals" }
    networks: [internal, edge]

  # ---------------- centralized logging (optional profile) ----------------
  loki:
    profiles: [observability]
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/local-config.yaml
    networks: [internal]

  alloy:
    profiles: [observability]
    image: grafana/alloy:v1.10.0
    command: run /etc/alloy/config.alloy
    volumes:
      - ./deploy/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [internal]

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin
    secrets: [grafana_admin]
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [loki]
    networks: [internal, edge]

secrets:
  db_password: { file: ./deploy/secrets/db_password }
  jwt_secrets: { file: ./deploy/secrets/jwt_secrets }
  encryption_keys: { file: ./deploy/secrets/encryption_keys }
  users_json: { file: ./deploy/secrets/users.json }
  grafana_admin: { file: ./deploy/secrets/grafana_admin }

volumes:
  pg-data:

networks:
  internal: { internal: false }
  edge: {}
