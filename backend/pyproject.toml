[project]
name = "vitals-monitor-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore::DeprecationWarning:starlette"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "BLE", "SIM"]
ignore = ["B008", "S101", "S105", "S106", "S311", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "BLE", "E402", "B"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B104", "B608"]  # 0.0.0.0 bind is intended in-container; B608 SQL is parameterised (see store.py)
