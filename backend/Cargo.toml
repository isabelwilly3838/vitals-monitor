[package]
name = "vitals_monitor"
version = "1.0.0"
edition = "2024"
description = "Real-time FHIR R4B vitals backend (body temperature + blood pressure)"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "vitals_monitor"
path = "src/main.rs"

[[bin]]
name = "vitalsctl"
path = "src/bin/vitalsctl.rs"

[dependencies]
# web
actix-web = { version = "4", default-features = false, features = ["macros"] }   # no http2/compression: nginx does that at the edge
actix-ws = "0.4"
actix-files = "0.7"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }

# data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-aux = "4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "uuid", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
fhir-sdk = { version = "0.16", default-features = false, features = ["r4b"] }

# configuration & secrets
config = { version = "0.15", default-features = false, features = ["yaml"] }
secrecy = { version = "0.10", features = ["serde"] }

# telemetry
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-bunyan-formatter = "0.3"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }

# security
jsonwebtoken = "9"
bcrypt = "0.17"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rcgen = "0.13"

# errors
thiserror = "2"
anyhow = "1"
regex = "1"
once_cell = "1"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["test-util"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.26"

[profile.dev.package.sqlx-macros]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
