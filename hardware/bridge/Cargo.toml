[package]
name = "vitals-bridge"
version = "0.1.0"
edition = "2024"
description = "USB serial -> FHIR bridge for the Arduino vitals sensor"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
# no libudev: builds on Linux without extra system packages
serialport = { version = "4", default-features = false }
