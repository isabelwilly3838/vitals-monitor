name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }

permissions: { contents: read }

env:
  CARGO_TERM_COLOR: always

defaults:
  run: { working-directory: backend }

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2          # dependency caching
        with: { workspaces: backend }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  # Integration tests need PostgreSQL: run them on Linux with a service container.
  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_DATABASE__PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-llvm-cov,cargo-nextest" }
      - name: Unit + integration + property tests with coverage
        run: cargo llvm-cov nextest --profile ci --lcov --output-path lcov.info
      - name: Coverage gate (>= 80 % lines) + summary
        run: |
          cargo llvm-cov report --summary-only --fail-under-lines 80 | tee coverage.txt
          { echo "### Coverage"; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            backend/lcov.info
            backend/target/nextest/ci/junit.xml

  # Portability: everything that does not need a database, on all three OSes.
  cross-platform:
    needs: lint
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      - run: cargo test --lib --test fhir --test property

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit }
      - name: Dependency vulnerability scan (RustSec)
        run: cargo audit

  docker:
    needs: [test, security]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: vitals-monitor-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      - name: Smoke test the whole stack (prod config, generated secrets)
        run: |
          (cd backend && cargo run -q --bin vitalsctl -- gen-secrets)
          docker compose up -d postgres backend
          for i in $(seq 1 40); do
            docker compose exec -T backend vitalsctl health && break; sleep 2
          done
          docker compose exec -T backend vitalsctl health http://127.0.0.1:8000/fhir/metadata
          docker compose logs backend | head -20
          docker compose down -v
