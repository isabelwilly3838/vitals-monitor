# Edge proxy: TLS termination, static frontend, reverse proxy + WebSocket upgrade,
# load balancing with passive health checks across backend replicas.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types application/json application/fhir+json application/javascript text/css;
  client_max_body_size 64k;

  log_format json escape=json '{"timestamp":"$time_iso8601","level":"info","logger":"nginx",'
    '"event":"edge_request","method":"$request_method","path":"$uri","status":$status,'
    '"duration_ms":$request_time,"upstream":"$upstream_addr","request_id":"$request_id"}';
  access_log /dev/stdout json;

  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

  upstream backend {
    # Docker DNS returns every replica of the service; nginx round-robins between them and
    # takes a replica out for 10s after 3 failures (passive health check).
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 16;
  }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    root /usr/share/nginx/html;
    location / { try_files $uri $uri/ /index.html; }

    location ~ ^/(fhir|admin|health)/ {
      limit_req zone=api burst=100 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
    }

    location /auth/ {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://backend;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-ID $request_id;
    }

    location /ws/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 1h;
    }
  }
}
